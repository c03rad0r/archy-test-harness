---
# Cashu mint used by the test bench.
#
# The Nutshell instance on x280_test is the one the router already uses. Keep
# its private key and data directory unchanged: changing either creates a new
# keyset and makes the existing drain-journal tokens unspendable.

cashu_mint_backend: nutshell
cashu_mint_service_name: cashu-mint
cashu_mint_v6_service_name: cashu-mint-v6
cashu_mint_container: cashu-mint
cashu_mint_user: archipelago
cashu_mint_port: 3338
cashu_mint_data_dir: /home/archipelago/nutshell-data
cashu_mint_podman_bin: /usr/bin/podman
cashu_mint_socat_bin: /usr/bin/socat

cashu_mint_image: docker.io/cashubtc/nutshell:0.21.0
cashu_mint_nutshell_command: poetry run mint
# Required only when creating a new Nutshell mint. Existing mints keep the key
# in their 0600 mint.env file and this role never overwrites it with a blank.
# Pass it via CASHU_MINT_PRIVATE_KEY / -e when first deploying a mint.
cashu_mint_private_key: ""

# cdk-mintd variant (production x280). The mnemonic is read from the existing
# environment/data when this role is used there; leave it empty unless the
# caller explicitly provides it.
cashu_mint_binary: /home/c08r4d0r/cdk-mint/cdk-mintd
cashu_mint_mnemonic: ""
cashu_mint_manage_config: false
cashu_mint_extra_args: ""

cashu_mint_replace_legacy: false
cashu_mint_legacy_container: nutshell

cashu_mint_fips_proxy: true
cashu_mint_fips_interface: fips0
cashu_mint_fips_address: ""
cashu_mint_advertise_host: ""
cashu_mint_advertise_url: ""
