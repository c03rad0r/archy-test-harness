---
# Fleet hosts used by the harness. No secrets live here; SSH agent/config or
# keys on the controller provide authentication.
#
# Roles:
#   build : ISO/cargo build host; KVM not required
#   vm    : QEMU/KVM host for installer/onboarding lanes
#   node  : an installed Archipelago node
all:
  children:
    fleet:
      hosts:
        x240:
          ansible_host: x240
          ansible_user: c08r4d0r
          host_role: build
          kvm_required: false
        t440:
          ansible_host: t440
          ansible_user: c08r4d0r
          host_role: vm
          kvm_required: true
        x280:
          ansible_host: x280
          ansible_user: archipelago
          host_role: node
          kvm_required: false
        x280_test:
          # The wiped/lab test x280. Never point this at the production
          # fleet-gateway x280.
          ansible_host: 192.168.50.199
          ansible_user: archipelago
          host_role: node
          archy_test_node: true
          kvm_required: false
        gl_mt3000:
          # Read-only checks only. Router provisioning belongs to
          # tollgate-installer, not Ansible.
          ansible_host: 192.168.50.205
          ansible_user: root
          host_role: router
          ansible_connection: ssh
          ansible_shell_type: ash
          kvm_required: false
        inr2:
          # Shared build host. SSH access is pending: port 22023 does not speak
          # SSH; port 22 answers but the key is not installed yet.
          ansible_host: inr2.cashu.exchange
          ansible_port: 22
          ansible_user: debian
          host_role: build
          kvm_required: false
